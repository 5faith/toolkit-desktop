name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download ffmpeg
        shell: pwsh
        run: |
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ffmpeg" -Force
          $dir = Get-ChildItem "$env:TEMP\ffmpeg" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path "src-tauri/resources" -Force
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" "src-tauri/resources/"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ''

      - name: Create Windows Portable ZIP
        shell: pwsh
        run: |
          cd src-tauri/target/release
          Compress-Archive -Path "*.exe", "resources" -DestinationPath portable.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME}"
          gh release create "$version" \
            --title "Toolkit Desktop $version" \
            --draft \
            --notes "Toolkit Desktop $version" \
            "src-tauri/target/release/portable.zip#Toolkit-Desktop-${version}-windows-x64-portable.zip"
