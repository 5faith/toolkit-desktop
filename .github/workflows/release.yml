name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi --config {"bundle":{"windows":{"nsis":{"installMode":"both"}}}}'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Toolkit Desktop ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            ### Windows
            - **Setup (.exe)**: NSIS installer (recommended)
            - **Portable (.exe)**: 便携版，无需安装，解压即用
            - **MSI (.msi)**: Windows Installer package

            ### macOS
            - **Apple Silicon (.dmg)**: For M1/M2/M3/M4 Macs
            - **Intel (.dmg)**: For Intel Macs

            ### Linux
            - **AppImage (.AppImage)**: Portable, no installation needed
            - **Debian (.deb)**: For Ubuntu/Debian
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  build-windows-portable:
    runs-on: windows-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable executable
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: '--bundles nsis --config {"bundle":{"windows":{"nsis":{"installMode":"currentUser","portable":true}}}}'
