name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Toolkit Desktop ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            ### Windows
            - **Portable (.zip)**: 便携版，解压即用，无需安装
            - **Setup (.exe)**: NSIS 安装包（推荐）
            - **MSI (.msi)**: Windows Installer 安装包

            ### macOS
            - **Apple Silicon (.dmg)**: For M1/M2/M3/M4 Macs
            - **Intel (.dmg)**: For Intel Macs

            ### Linux
            - **AppImage (.AppImage)**: Portable, no installation needed
            - **Debian (.deb)**: For Ubuntu/Debian
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "Toolkit-Desktop-${version}-windows-x64-portable.zip"
          $stagingDir = "portable-staging"
          New-Item -ItemType Directory -Path $stagingDir

          $exePath = Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" | Where-Object { $_.Name -notlike "*bundle*" } | Select-Object -First 1
          Copy-Item $exePath.FullName "$stagingDir/"

          Compress-Archive -Path "$stagingDir/*" -DestinationPath $zipName
          gh release upload "${{ github.ref_name }}" $zipName --clobber

      - name: Create macOS x64 portable zip
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        run: |
          APP_PATH=$(find src-tauri/target/x86_64-apple-darwin/release/bundle -name "*.app" -type d | head -1)
          VERSION="${{ github.ref_name }}"
          ZIP_NAME="Toolkit-Desktop-${VERSION}-macos-x64.zip"
          cd "$(dirname "$APP_PATH")"
          zip -r "../../$ZIP_NAME" "$(basename "$APP_PATH")"
          cd ../..
          gh release upload "${{ github.ref_name }}" "$ZIP_NAME" --clobber

      - name: Create macOS arm64 portable zip
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        run: |
          APP_PATH=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name "*.app" -type d | head -1)
          VERSION="${{ github.ref_name }}"
          ZIP_NAME="Toolkit-Desktop-${VERSION}-macos-arm64.zip"
          cd "$(dirname "$APP_PATH")"
          zip -r "../../$ZIP_NAME" "$(basename "$APP_PATH")"
          cd ../..
          gh release upload "${{ github.ref_name }}" "$ZIP_NAME" --clobber
