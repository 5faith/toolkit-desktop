name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ffmpeg" -Force
          $dir = Get-ChildItem "$env:TEMP\ffmpeg" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path "src-tauri/resources" -Force
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe" "src-tauri/resources/"

      - name: Download ffmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew trust aws/tap
          brew install ffmpeg
          mkdir -p src-tauri/resources
          cp $(which ffmpeg) src-tauri/resources/ffmpeg

      - name: Download ffmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y ffmpeg
          mkdir -p src-tauri/resources
          cp $(which ffmpeg) src-tauri/resources/ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Toolkit Desktop ${{ github.ref_name }}
          releaseBody: '## Toolkit Desktop ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "Toolkit-Desktop-${version}-windows-x64-portable.zip"
          $sourceDir = "src-tauri/target/release"
          $zipPath = Join-Path $sourceDir $zipName

          Compress-Archive -Path "$sourceDir/toolkit-desktop.exe" -DestinationPath $zipPath -Force

          if (Test-Path $zipPath) {
            Write-Host "Created $zipName"
          } else {
            Write-Error "Failed to create zip"
            exit 1
          }

      - name: Upload portable ZIP to release
        if: matrix.platform == 'windows-latest'
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          ZIP_NAME="Toolkit-Desktop-${TAG}-windows-x64-portable.zip"
          ZIP_PATH="src-tauri/target/release/${ZIP_NAME}"

          gh release upload "${TAG}" "${ZIP_PATH}" --repo "${{ github.repository }}" --clobber
