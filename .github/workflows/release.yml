name: Build and Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Toolkit Desktop ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            ### Windows
            - **Setup (.exe)**: NSIS installer (recommended)
            - **MSI (.msi)**: Windows Installer package

            ### macOS
            - **Apple Silicon (.dmg)**: For M1/M2/M3 Macs
            - **Intel (.dmg)**: For Intel Macs

            ### Linux
            - **AppImage (.AppImage)**: Portable, no installation needed
            - **Debian (.deb)**: For Ubuntu/Debian
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
